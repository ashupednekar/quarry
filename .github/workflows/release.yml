name: Release

# Push a tag like v0.1.0 to build Linux, Windows and macOS packages and publish them as a GitHub release.
# macOS ships an ad-hoc signed DMG (not notarized), so users clear quarantine once (see README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Prevent rustc stack overflow on deep GPUI macro/builder recursion
  RUST_MIN_STACK: "67108864"

jobs:
  package:
    name: Package (${{ matrix.os }})
    # Waits for a required reviewer on the "release" environment (repo Settings → Environments)
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies & mold linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang mold libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restores the dependency cache warm-cache.yml saves on main (tag runs can't share caches with each other)
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "quarry-release-${{ matrix.os }}"
          save-if: false

      # Install pre-compiled cargo-packager binary instead of compiling from source (saves 2-4 mins)
      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      # With the signing key set, cargo-packager also writes a .sig per bundle for the updater
      - name: Build & package application
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo packager --release -f ${{ matrix.formats }}
        working-directory: crates/quarry-app

      - uses: actions/upload-artifact@v4
        with:
          name: quarry-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.sig
          if-no-files-found: error

  macos:
    name: Package (macos-latest)
    environment: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "quarry-release-macos-latest"
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - run: scripts/package-macos.sh
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: quarry-macOS
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.sig
          if-no-files-found: error

  publish:
    needs: [package, macos]
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes are the commits since the previous tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Update manifest the app reads from releases/latest/download/latest.json
      - name: Write latest.json
        run: |
          cd out
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platform() { # key, bundle file, format
            jq -n --arg url "$base/$2" --arg sig "$(cat "$2.sig")" --arg format "$3" \
              '{($ARGS.positional[0]): {url: $url, signature: $sig, format: $format}}' --args "$1"
          }
          {
            platform macos-aarch64 Quarry.app.tar.gz app
            platform linux-x86_64 "$(ls *.AppImage)" appimage
            platform windows-x86_64 "$(ls *.exe)" nsis
          } | jq -s --arg v "${GITHUB_REF_NAME#v}" \
            '{version: $v, pub_date: (now | todate), platforms: add}' > latest.json
          cat latest.json

      # Release notes from conventional commits: feat → Features, fix/perf → Fixes; chore, docs, ci, build and site left out
      - name: Write release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          section() { # title, types regex
            lines=$(git log --no-merges --reverse --format='%s' "$range" \
              | grep -E "^($2)(\([^)]*\))?!?: " | grep -vE '^[a-z]+\(site\)' \
              | sed -E 's/^[a-z]+(\(([^)]*)\))?!?: (.*)/\3 (\2)/; s/ \(\)$//' \
              | awk '{ print "- " toupper(substr($0, 1, 1)) substr($0, 2) }')
            [ -n "$lines" ] && printf '## %s\n\n%s\n\n' "$1" "$lines"
            true
          }
          {
            section Features feat
            section Fixes 'fix|perf'
            [ -n "$prev" ] && echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            true
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Suffixed tags (v1.2.0-beta.1) are pre-releases, which releases/latest (and so the updater) skips
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quarry $GITHUB_REF_NAME" \
            --notes-file notes.md $pre
