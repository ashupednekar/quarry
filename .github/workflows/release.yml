name: Release

# Push a tag like v0.1.0 to build Linux and Windows packages and publish them as a GitHub release.
# macOS is built from source by users (see README): there's no Apple signing identity for CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Granular compiler cache for external dependencies
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # Prevent rustc stack overflow on deep GPUI macro/builder recursion
  RUST_MIN_STACK: "67108864"

jobs:
  package:
    name: Package (${{ matrix.os }})
    # Waits for a required reviewer on the "release" environment (repo Settings → Environments)
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies & mold linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang mold libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Sets up sccache compiler cache backed by GitHub Actions cache
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Caches ~/.cargo registry and target/ across releases with a shared release key
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "quarry-release-${{ matrix.os }}"

      # Install pre-compiled cargo-packager binary instead of compiling from source (saves 2-4 mins)
      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build & package application
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: cargo packager --release -f ${{ matrix.formats }}
        working-directory: crates/quarry-app

      - name: Print sccache stats
        run: sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: quarry-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # 0.x and suffixed tags (v1.2.0-beta.1) are published as pre-releases
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quarry $GITHUB_REF_NAME" \
            --generate-notes $pre
