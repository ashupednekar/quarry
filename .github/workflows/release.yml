name: Release

# Push a tag like v0.1.0 to build Linux and Windows packages and publish them as a GitHub release.
# macOS is built from source by users (see README): there's no Apple signing identity for CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
          - os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype6-dev libvulkan-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-packager --locked
      - run: cargo packager --release -f ${{ matrix.formats }}
        working-directory: crates/quarry-app

      - uses: actions/upload-artifact@v4
        with:
          name: quarry-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # 0.x and suffixed tags (v1.2.0-beta.1) are published as pre-releases
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quarry $GITHUB_REF_NAME" \
            --generate-notes $pre
