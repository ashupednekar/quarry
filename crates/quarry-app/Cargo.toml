[package]
name = "quarry-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "quarry"
path = "src/main.rs"

# `cargo packager --release -f <format>` from the workspace root; output lands in dist/
[package.metadata.packager]
product-name = "Quarry"
identifier = "ai.quarry.quarry"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p quarry-app"
out-dir = "../../dist"
binaries = [{ path = "quarry", main = true }]

[dependencies]
quarry-core = { workspace = true }
quarry-sql = { workspace = true }
gpui = { workspace = true }
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }
lsp-types = { workspace = true }
sqlformat = { workspace = true }

[lints]
workspace = true
