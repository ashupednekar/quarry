[package]
name = "quarry-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# One feature per driver; the app enables the ones it ships
[features]
default = ["postgres", "sqlite", "mysql", "mssql", "oracle"]
postgres = ["dep:tokio-postgres", "dep:futures-util"]
sqlite = ["dep:rusqlite"]
mysql = ["dep:mysql_async", "dep:futures-util"]
mssql = ["dep:tiberius", "dep:tokio-util", "dep:futures-util"]
oracle = ["dep:oracle"]

[dependencies]
tokio = { workspace = true }
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
mysql_async = { workspace = true, optional = true }
tiberius = { workspace = true, optional = true }
oracle = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
