<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 16 16">
  <!-- Hand-tuned for 16–32px: the same mark on the pixel grid, with gaps a full pixel wide so the cut survives -->
  <rect width="16" height="16" rx="3.5" fill="#111315"/>
  <g fill="#F2F0EA">
    <rect x="3.5" y="2.5" width="9" height="3.5" rx="1.75"/>
    <rect x="3.5" y="7" width="9" height="3" rx="1.25"/>
    <rect x="3.5" y="11" width="9" height="3" rx="1.25"/>
  </g>
  <!-- The cut: one diagonal through every layer -->
  <path d="M2.5 3.5 L12.5 13.5" stroke="#111315" stroke-width="1.5" stroke-linecap="square"/>
</svg>
